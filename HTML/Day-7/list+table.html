<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>football</title>
</head>

<body>
    <center>
        <h1>Joining for the football Team</h1>
        <form action="football.html" method="post">
            <table>
                <tr>
                    <td><label for="name">Enter Your Name</label></td>
                    <td><input id="name" type="text" placeholder="Start With initial Cap" required /></td>
                </tr>
                <tr>
                    <td><label for="age">Enter Your Age</label></td>
                    <td><input id="age" type="number" placeholder="Enter your age" required /></td>
                </tr>
                <tr>
                    <td><label for="mobile">Mobile</label></td>
                    <td><input id="mobile" type="number" placeholder="Enter your mobile number" required /></td>
                </tr>
                <tr>
                    <td><label for="Father Name">Enter Your Father's Name</label></td>
                    <td><input id="Father Name" type="text" placeholder="Enter your father's name" required /></td>
                </tr>

                <tr>
                    <td><label for="district">Enter Your District</label></td>
                    <td><input id="district" type="text" placeholder="Enter your district" required /></td>
                </tr>
                <tr></tr>

                <br>
            </table>

            </br>
            <table>
                <label for="Criteria">Select Your Criteria</label>
                <select id="Criteria" required>
                    <option value="" selected disabled>Select Your division</option>
                    <option value="Under 15">Under 15</option>
                    <option value="Under 17">Under 17</option>
                    <option value="Under 19">Under 19</option>
                    <option value="Above 19">Above 19</option>
                </select>
                </br>
                </br>

                <label for="Category">Category</label>
                <select id="Category" required>
                    <option value="" selected disabled>Select your Category</option>


                    <option value="center">center</option>
                    <option value="midfielder">midfileder</option>
                    <option value="Attacker">Attacker</option>
                    <option value="goal keeper">goal keeper</option>
                </select>

                </br>
                </br>

                   
                <label for="position">position</label>
                <select id="position" required>
                    <option value="" selected disabled>Select your position</option>
                    <option value="None">None </option>

                    <option value="Right corner">right corner</option>
                    <option value="left corner">left corner</option>
                    <option value="center">center</option>
                    <option value="Attacker">Attacker</option>
                </select>
                </br>
                </br>
            </table>
            <input type="submit" value="Join Team">

            </br>
            </br>
        </form>


        <div>
            <table border="2">
                <thead>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Mobile</th>
                    <th>Father Name</th>
                    <th>District</th>
                    <th>Criteria</th>

                    <th>Category</th>
            



                </thead>

                <tbody>
                    <tr>
                        <td>Ronaldo</td>
                        <td>42</td>
                        <td>9876543210</td>
                        <td>Abraham</td>
                        <td>portugal</td>
                        <td>Above 19</td>
                        <td>Attacker</td> 


                    </tr>
                </tbody>
            </table>
        </div>

    </center>

</body>

</html>
